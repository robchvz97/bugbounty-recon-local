<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bug Bounty Recon Local</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f1419; color: #e7e9ea; margin: 0; padding: 20px; }
        h1 { color: #1d9bf0; }
        input[type=text] { width: 400px; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #333; background: #16181c; color: white; }
        button { padding: 10px 20px; font-size: 16px; background: #1d9bf0; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1a8cd8; }
        .panels { display: flex; gap: 20px; margin-top: 30px; }
        .panel { flex: 1; background: #16181c; border-radius: 12px; padding: 15px; min-height: 400px; border: 1px solid #2f3336; }
        .panel h2 { margin-top: 0; color: #1d9bf0; }
        .status { font-weight: bold; margin-bottom: 10px; }
        .results { font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 500px; overflow-y: auto; background: #0f1419; padding: 10px; border-radius: 6px; }
        .done { color: #00ba7c; }
        .running { color: #ffd400; }
        .error { color: #f4212e; }
        .pending { color: #71767b; }
    </style>
</head>
<body>
    <h1>🔍 Bug Bounty Recon Local</h1>
    <p>Pega el URL del scope (ej: example.com o https://target.com)</p>
    <input type="text" id="urlInput" placeholder="example.com">
    <button onclick="startScan()">Escanear</button>
    <div id="info"></div>

    <div class="panels">
        <div class="panel">
            <h2>Subdominios vivos</h2>
            <div class="status pending" id="status-sub">Pendiente</div>
            <div class="results" id="res-sub"></div>
        </div>
        <div class="panel">
            <h2>Tecnologías</h2>
            <div class="status pending" id="status-tech">Pendiente</div>
            <div class="results" id="res-tech"></div>
        </div>
        <div class="panel">
            <h2>Fuzzing directorios</h2>
            <div class="status pending" id="status-fuzz">Pendiente</div>
            <div class="results" id="res-fuzz"></div>
        </div>
    </div>

    <script>
        let currentScan = null;
        let pollInterval = null;

        async function startScan() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('Pon un URL');

            document.getElementById('info').innerText = 'Iniciando...';
            const res = await fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url})
            });
            const data = await res.json();
            if (data.error) return alert(data.error);

            currentScan = data.scan_id;
            document.getElementById('info').innerText = `Scan ${currentScan} en ${data.domain}`;
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(pollStatus, 2000);
            pollStatus();
        }

        async function pollStatus() {
            if (!currentScan) return;
            const res = await fetch(`/status/${currentScan}`);
            const data = await res.json();

            updatePanel('sub', data.subdomains);
            updatePanel('tech', data.tech);
            updatePanel('fuzz', data.fuzz);

            // Si todos terminaron, dejar de pollear
            if (['done','error'].includes(data.subdomains.status) &&
                ['done','error'].includes(data.tech.status) &&
                ['done','error'].includes(data.fuzz.status)) {
                clearInterval(pollInterval);
            }
        }

        function updatePanel(key, obj) {
            const statusEl = document.getElementById(`status-${key}`);
            const resEl = document.getElementById(`res-${key}`);
            statusEl.className = `status ${obj.status}`;
            statusEl.innerText = obj.status.toUpperCase();
            resEl.innerText = (obj.results || []).join('\n');
        }
    </script>
</body>
</html>
